[OWASP_A05_XSS_Payload_Detection]
search = index=web sourcetype=access_combined OR sourcetype=iis | eval request_combined=uri_query + " " + coalesce(form_data, "") + " " + coalesce(cookie, "") | where match(request_combined, "(?i)(<script[^>]*>|javascript\s*:|on(error|load|click|mouseover|focus|blur)\s*=|eval\s*\(|document\.(cookie|location|write)|alert\s*\(|prompt\s*\(|confirm\s*\(|String\.fromCharCode|atob\s*\()") | eval xss_type=case(match(request_combined, "(?i)<script"), "reflected_script", match(request_combined, "(?i)on(error|load|click)"), "event_handler", match(request_combined, "(?i)document\.(cookie|location)"), "dom_manipulation", 1=1, "generic") | stats count as xss_attempts values(xss_type) as attack_types values(uri_path) as targeted_pages dc(uri_path) as unique_pages by src_ip user _time span=10m | where xss_attempts >= 3 | eval severity=case(match(attack_types, "dom_manipulation"), "critical", xss_attempts>=10, "high", 1=1, "medium") | eval mitre_attack="T1189,T1059.007" | eval owasp_category="A05:2025-Injection"
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = src_ip
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A05 - XSS Payload Detected
action.notable = 1
action.notable.param.security_domain = network
action.notable.param.severity = high
action.notable.param.rule_title = XSS Attack Detected - $src_ip$
action.notable.param.rule_description = Source $src_ip$ injected $xss_attempts$ XSS payloads across $unique_pages$ pages. Attack types: $attack_types$. Targeted pages: $targeted_pages$
action.notable.param.drilldown_name = View XSS attempts
action.notable.param.drilldown_search = index=web src_ip="$src_ip$" earliest=-1h | regex uri_query="(?i)(script|javascript|onerror|onload|eval|document\.cookie)"
