[OWASP_A03_Unauthorized_Package_Installation]
search = index=osquery OR index=endpoint sourcetype=osquery:results OR sourcetype=sysmon | where (name="pack_incident-response_process_events" OR EventCode=1) | search (CommandLine="*pip install*" OR CommandLine="*npm install*" OR CommandLine="*gem install*" OR CommandLine="*curl*|*sh*" OR CommandLine="*wget*|*bash*" OR CommandLine="*go get*") | rex field=CommandLine "(?:pip|npm|gem)\s+install\s+(?<package_name>[^\s;|&]+)" | lookup approved_packages package_name OUTPUT is_approved | where is_approved!="true" OR isnull(is_approved) | stats count as install_events values(CommandLine) as commands values(package_name) as packages dc(package_name) as unique_packages by user dest _time span=1h | where unique_packages >= 2 OR match(commands, "\|\s*(sh|bash)") | eval severity=case(match(commands, "\|\s*(sh|bash)"), "critical", unique_packages>=5, "critical", unique_packages>=3, "high", 1=1, "medium") | eval mitre_attack="T1195.002,T1059" | eval owasp_category="A03:2025-Software Supply Chain Failures"
cron_schedule = */15 * * * *
enableSched = 1
dispatch.earliest_time = -20m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 2h
alert.suppress.fields = dest
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A03 - Unauthorized Package Installation
action.notable = 1
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
action.notable.param.rule_title = Unauthorized Package Installation - $dest$
action.notable.param.rule_description = Host $dest$ (user: $user$) installed $unique_packages$ unapproved packages ($packages$). Commands: $commands$
action.notable.param.drilldown_name = View host process activity
action.notable.param.drilldown_search = index=endpoint dest="$dest$" (CommandLine="*install*" OR CommandLine="*curl*" OR CommandLine="*wget*") earliest=-2h
