[OWASP_A10_Verbose_Error_Information_Exposure]
search = index=web sourcetype=access_combined OR sourcetype=iis OR sourcetype=application | where status>=500 | rex field=_raw "(?i)(?<error_detail>(?:stack\s*trace|exception|error\s+in|ORA-\d+|mysql_|pg_|sqlite_|SQLSTATE|NullPointerException|System\.Exception|Traceback|undefined\s+is\s+not|TypeError|at\s+\w+\.\w+\(|\.java:\d+|\.py.*line\s+\d+|Fatal\s+error).*)" | where isnotnull(error_detail) | eval exposes_sensitive=if(match(error_detail, "(?i)(password|secret|key|token|connection.string|database|internal.path|/home/|/var/|C:\\\\)"), 1, 0) | stats count as error_count dc(uri_path) as affected_endpoints sum(exposes_sensitive) as sensitive_exposures values(uri_path) as endpoints by dest src_ip _time span=1h | where error_count >= 5 OR sensitive_exposures >= 1 | eval severity=case(sensitive_exposures>=3, "critical", sensitive_exposures>=1, "high", error_count>=20, "high", 1=1, "medium") | eval mitre_attack="T1190,T1082" | eval owasp_category="A10:2025-Mishandling of Exceptional Conditions"
cron_schedule = */15 * * * *
enableSched = 1
dispatch.earliest_time = -70m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 4h
alert.suppress.fields = dest
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A10 - Verbose Error Exposure
action.notable = 1
action.notable.param.security_domain = network
action.notable.param.severity = high
action.notable.param.rule_title = Verbose Error Exposure - $dest$
action.notable.param.rule_description = Server $dest$ exposed $error_count$ verbose errors across $affected_endpoints$ endpoints. $sensitive_exposures$ responses leaked sensitive data (passwords, keys, internal paths). Source: $src_ip$
action.notable.param.drilldown_name = View error responses
action.notable.param.drilldown_search = index=web dest="$dest$" status>=500 earliest=-4h | rex field=_raw "(?i)(?<error_detail>(?:stack.trace|exception|ORA-|SQLSTATE|Traceback).*)"
