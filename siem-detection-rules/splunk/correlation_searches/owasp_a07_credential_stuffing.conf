[OWASP_A07_Credential_Stuffing_Detection]
search = index=* sourcetype=linux_secure OR sourcetype=WinEventLog:Security OR sourcetype=access_combined | where (action="failure" OR EventCode=4625 OR status=401) | stats count as failed_attempts dc(user) as unique_users values(user) as targeted_users dc(dest) as unique_targets by src_ip _time span=10m | where failed_attempts >= 20 AND unique_users >= 5 | eval ratio=round(failed_attempts/unique_users, 2) | eval is_credential_stuffing=if(ratio >= 1 AND ratio <= 3 AND unique_users >= 5, 1, 0) | where is_credential_stuffing=1 | eval severity=case(failed_attempts>=100, "critical", failed_attempts>=50, "high", 1=1, "medium") | eval mitre_attack="T1110.004" | eval owasp_category="A07:2025-Authentication Failures"
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = src_ip
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A07 - Credential Stuffing Attack
action.notable = 1
action.notable.param.security_domain = access
action.notable.param.severity = critical
action.notable.param.rule_title = Credential Stuffing Attack - $src_ip$
action.notable.param.rule_description = Source $src_ip$ attempted $failed_attempts$ failed logins against $unique_users$ unique accounts within 10 minutes. Ratio: $ratio$ attempts/user. Targeted users: $targeted_users$
action.notable.param.drilldown_name = View brute force activity
action.notable.param.drilldown_search = index=* src_ip="$src_ip$" (action=failure OR EventCode=4625 OR status=401) earliest=-1h | stats count by user
