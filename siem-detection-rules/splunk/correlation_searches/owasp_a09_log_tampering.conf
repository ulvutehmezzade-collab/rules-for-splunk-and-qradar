[OWASP_A09_Log_Tampering_Detection]
search = index=_internal OR index=os sourcetype=linux_audit OR sourcetype=WinEventLog:Security | where (action="deleted" AND object_path LIKE "%/var/log/%") OR (EventCode=1102) OR (EventCode=104) OR match(CommandLine, "(?i)(Clear-EventLog|wevtutil\s+cl|rm\s+.*(/var/log|\.log)|shred|truncate.*log)") | eval tamper_type=case(EventCode=1102, "windows_audit_log_cleared", EventCode=104, "windows_system_log_cleared", match(CommandLine, "(?i)Clear-EventLog"), "powershell_log_clear", match(object_path, "/var/log"), "linux_log_deletion", 1=1, "generic_log_tamper") | stats count as tamper_events values(tamper_type) as types values(object_path) as affected_logs values(CommandLine) as commands by user src_ip dest _time span=5m | eval severity="critical" | eval mitre_attack="T1070.001,T1070.002" | eval owasp_category="A09:2025-Logging and Alerting Failures"
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = dest
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A09 - Log Tampering Detected
action.notable = 1
action.notable.param.security_domain = audit
action.notable.param.severity = critical
action.notable.param.rule_title = Log Tampering Detected - $dest$
action.notable.param.rule_description = Host $dest$ (user: $user$) performed $tamper_events$ log tampering actions. Types: $types$. Affected: $affected_logs$. Commands: $commands$
action.notable.param.drilldown_name = View log tampering
action.notable.param.drilldown_search = index=* dest="$dest$" (EventCode=1102 OR EventCode=104 OR action=deleted) earliest=-1h
