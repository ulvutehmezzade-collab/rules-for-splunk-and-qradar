[OWASP_A01_Privilege_Escalation_Detection]
search = | tstats summariesonly=true count from datamodel=Change where All_Changes.action=modified All_Changes.object_category=user by All_Changes.user All_Changes.dest All_Changes.object All_Changes.result _time span=5m | rename All_Changes.* as * | where result="success" | search object="*admin*" OR object="*privilege*" OR object="*role*" | stats count as escalation_attempts dc(dest) as unique_hosts values(object) as modified_objects by user _time | where escalation_attempts > 2 | eval severity=case(escalation_attempts>=5, "critical", escalation_attempts>=3, "high", 1=1, "medium") | eval mitre_attack="T1078.003,T1548" | eval owasp_category="A01:2025-Broken Access Control"
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = user
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A01 - Privilege Escalation Detected
action.notable = 1
action.notable.param.security_domain = access
action.notable.param.severity = high
action.notable.param.rule_title = Privilege Escalation Attempt - $user$
action.notable.param.rule_description = User $user$ modified privilege-related objects ($modified_objects$) across $unique_hosts$ hosts within 5 minutes.
action.notable.param.drilldown_name = View user activity
action.notable.param.drilldown_search = index=* sourcetype=* user="$user$" earliest=-1h
