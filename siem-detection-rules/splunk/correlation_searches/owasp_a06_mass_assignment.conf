[OWASP_A06_Mass_Assignment_Parameter_Tampering]
search = index=web sourcetype=access_combined OR sourcetype=application | where method="POST" OR method="PUT" OR method="PATCH" | rex field=form_data max_match=20 "(?<param_keys>[^=&]+)=" | mvexpand param_keys | search param_keys IN ("role", "isAdmin", "is_admin", "admin", "privilege", "group", "permission", "price", "discount", "balance", "user_id", "account_id", "owner", "approved", "verified", "status") | stats count as tamper_attempts dc(param_keys) as suspicious_params values(param_keys) as params values(uri_path) as endpoints by src_ip user _time span=15m | where suspicious_params >= 2 OR tamper_attempts >= 5 | eval severity=case(match(params, "(admin|role|privilege|permission)"), "critical", suspicious_params>=3, "high", 1=1, "medium") | eval mitre_attack="T1565.001" | eval owasp_category="A06:2025-Insecure Design"
cron_schedule = */10 * * * *
enableSched = 1
dispatch.earliest_time = -20m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 2h
alert.suppress.fields = src_ip
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A06 - Mass Assignment Attempt
action.notable = 1
action.notable.param.security_domain = access
action.notable.param.severity = high
action.notable.param.rule_title = Parameter Tampering Detected - $src_ip$
action.notable.param.rule_description = Source $src_ip$ (user: $user$) submitted $tamper_attempts$ requests with $suspicious_params$ suspicious parameters ($params$) to endpoints: $endpoints$
action.notable.param.drilldown_name = View tampering requests
action.notable.param.drilldown_search = index=web src_ip="$src_ip$" (method=POST OR method=PUT OR method=PATCH) earliest=-2h
