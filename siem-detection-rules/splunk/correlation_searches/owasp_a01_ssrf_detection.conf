[OWASP_A01_SSRF_Internal_Network_Access]
search = index=web sourcetype=access_combined OR sourcetype=iis | rex field=uri_query "(?i)(?:url|uri|path|dest|redirect|target|fetch|load|request)=(?<ssrf_target>[^\s&\"']+)" | where isnotnull(ssrf_target) | eval is_internal=if(match(ssrf_target, "^https?://(127\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|169\.254\.|0\.0\.0\.0|localhost|metadata\.google|169\.254\.169\.254)"), 1, 0) | where is_internal=1 | stats count as ssrf_attempts values(ssrf_target) as targets values(uri_path) as endpoints dc(ssrf_target) as unique_targets by src_ip clientip user _time span=10m | where ssrf_attempts >= 3 OR unique_targets >= 2 | eval severity=case(unique_targets>=5, "critical", unique_targets>=3, "high", 1=1, "medium") | eval mitre_attack="T1190,T1018" | eval owasp_category="A01:2025-Broken Access Control (SSRF)"
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = src_ip
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A01 - SSRF Internal Network Access
action.notable = 1
action.notable.param.security_domain = network
action.notable.param.severity = critical
action.notable.param.rule_title = SSRF Attack Detected - $src_ip$
action.notable.param.rule_description = Source IP $src_ip$ attempted to access internal resources ($targets$) via SSRF. $ssrf_attempts$ attempts targeting $unique_targets$ unique internal addresses.
action.notable.param.drilldown_name = View SSRF attempts
action.notable.param.drilldown_search = index=web src_ip="$src_ip$" earliest=-1h | search uri_query="*url=*" OR uri_query="*redirect=*"
