[OWASP_A03_CICD_Pipeline_Tampering]
search = index=devops sourcetype=github:webhook OR sourcetype=gitlab:events OR sourcetype=jenkins:events | where (action="workflow_modified" OR action="pipeline_config_changed" OR action="build_definition_updated" OR event_type="push" AND (file_path="*.yml" OR file_path="*Jenkinsfile*" OR file_path="*Dockerfile*" OR file_path=".github/workflows/*")) | eval is_protected_branch=if(match(branch, "^(main|master|release|production)"), 1, 0) | where is_protected_branch=1 | stats count as changes dc(file_path) as files_modified values(file_path) as modified_files values(commit_message) as messages by actor repo branch _time span=1h | eval has_bypass=if(match(messages, "(?i)(skip.ci|no.check|force.push|bypass)"), 1, 0) | where changes >= 1 | eval severity=case(has_bypass=1, "critical", files_modified>=3, "high", 1=1, "medium") | eval mitre_attack="T1195.002,T1072" | eval owasp_category="A03:2025-Software Supply Chain Failures"
cron_schedule = */10 * * * *
enableSched = 1
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = actor,repo
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A03 - CI/CD Pipeline Tampering
action.notable = 1
action.notable.param.security_domain = access
action.notable.param.severity = critical
action.notable.param.rule_title = CI/CD Pipeline Modified - $repo$ by $actor$
action.notable.param.rule_description = Actor $actor$ modified $files_modified$ pipeline config files ($modified_files$) in protected branch $branch$ of repo $repo$. Bypass indicators: $has_bypass$.
action.notable.param.drilldown_name = View repo activity
action.notable.param.drilldown_search = index=devops repo="$repo$" actor="$actor$" earliest=-4h
