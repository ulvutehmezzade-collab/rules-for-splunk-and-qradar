[OWASP_A02_Exposed_Admin_Panel_Access]
search = index=web sourcetype=access_combined OR sourcetype=iis | where (uri_path LIKE "%/admin%" OR uri_path LIKE "%/manager%" OR uri_path LIKE "%/console%" OR uri_path LIKE "%/phpmyadmin%" OR uri_path LIKE "%/wp-admin%" OR uri_path LIKE "%/.env%" OR uri_path LIKE "%/actuator%" OR uri_path LIKE "%/swagger%") | where status>=200 AND status<400 | eval is_external=if(NOT match(src_ip, "^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)"), 1, 0) | where is_external=1 | stats count as access_count dc(uri_path) as unique_admin_paths values(uri_path) as paths values(status) as response_codes by src_ip user _time span=15m | where access_count >= 3 | eval severity=case(unique_admin_paths>=4, "critical", unique_admin_paths>=2, "high", 1=1, "medium") | eval mitre_attack="T1190,T1595.002" | eval owasp_category="A02:2025-Security Misconfiguration"
cron_schedule = */10 * * * *
enableSched = 1
dispatch.earliest_time = -20m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 2h
alert.suppress.fields = src_ip
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A02 - External Admin Panel Access
action.notable = 1
action.notable.param.security_domain = access
action.notable.param.severity = high
action.notable.param.rule_title = External Admin Panel Access - $src_ip$
action.notable.param.rule_description = External IP $src_ip$ successfully accessed $unique_admin_paths$ admin paths ($paths$) with HTTP $response_codes$ responses.
action.notable.param.drilldown_name = View admin access attempts
action.notable.param.drilldown_search = index=web src_ip="$src_ip$" uri_path="*/admin*" OR uri_path="*/manager*" OR uri_path="*/console*" earliest=-2h
