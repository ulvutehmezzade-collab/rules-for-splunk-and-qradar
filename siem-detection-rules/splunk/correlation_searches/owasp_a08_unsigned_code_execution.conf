[OWASP_A08_Unsigned_Code_Execution]
search = index=endpoint sourcetype=sysmon EventCode=1 | where NOT match(Hashes, "(?i)sha256=") OR isnull(Hashes) | eval is_script=if(match(Image, "(?i)\.(ps1|bat|cmd|vbs|js|py|sh)$"), 1, 0) | eval is_unsigned=if(match(SignatureStatus, "(?i)(unsigned|unavailable|invalid)") OR isnull(SignatureStatus), 1, 0) | where is_unsigned=1 AND (ParentImage LIKE "%\\services.exe" OR ParentImage LIKE "%\\svchost.exe" OR ParentImage LIKE "%\\taskeng.exe" OR ParentImage LIKE "%\\wmiprvse.exe") | stats count as unsigned_executions dc(Image) as unique_binaries values(Image) as executables values(CommandLine) as commands by Computer User _time span=30m | where unsigned_executions >= 3 OR unique_binaries >= 2 | eval severity=case(match(commands, "(?i)(download|invoke-webrequest|curl|wget|certutil)"), "critical", unique_binaries>=3, "high", 1=1, "medium") | eval mitre_attack="T1218,T1036.005" | eval owasp_category="A08:2025-Software or Data Integrity Failures"
cron_schedule = */10 * * * *
enableSched = 1
dispatch.earliest_time = -35m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 2h
alert.suppress.fields = Computer
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A08 - Unsigned Code Execution
action.notable = 1
action.notable.param.security_domain = endpoint
action.notable.param.severity = critical
action.notable.param.rule_title = Unsigned Code Execution - $Computer$
action.notable.param.rule_description = Host $Computer$ (user: $User$) executed $unsigned_executions$ unsigned binaries ($unique_binaries$ unique). Executables: $executables$. Commands: $commands$
action.notable.param.drilldown_name = View process execution
action.notable.param.drilldown_search = index=endpoint sourcetype=sysmon EventCode=1 Computer="$Computer$" earliest=-2h | where SignatureStatus!="Valid"
