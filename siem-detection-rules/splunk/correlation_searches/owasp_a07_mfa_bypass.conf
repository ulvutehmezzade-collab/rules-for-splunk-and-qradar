[OWASP_A07_MFA_Bypass_Attempts]
search = index=auth sourcetype=okta:log OR sourcetype=azure:aad:signin OR sourcetype=duo:auth | where (eventType="user.authentication.auth_via_mfa" OR eventType="user.mfa.factor.update" OR category="MFA") | eval mfa_failed=if(outcome.result="FAILURE" OR result="denied" OR status.errorCode!="0", 1, 0) | eval mfa_bypassed=if(match(debugContext.debugData.factor, "(?i)(sms|phone_call)") OR match(eventType, "factor.*(deactivate|reset)"), 1, 0) | stats count as mfa_events sum(mfa_failed) as failures sum(mfa_bypassed) as bypass_indicators values(eventType) as event_types values(client.ipAddress) as source_ips by actor.alternateId target.alternateId _time span=30m | where failures >= 5 OR bypass_indicators >= 2 | eval severity=case(bypass_indicators>=2, "critical", failures>=10, "high", 1=1, "medium") | eval mitre_attack="T1556.006,T1111" | eval owasp_category="A07:2025-Authentication Failures"
cron_schedule = */10 * * * *
enableSched = 1
dispatch.earliest_time = -35m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 2h
alert.suppress.fields = actor.alternateId
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A07 - MFA Bypass Attempt
action.notable = 1
action.notable.param.security_domain = access
action.notable.param.severity = critical
action.notable.param.rule_title = MFA Bypass Attempt - $actor.alternateId$
action.notable.param.rule_description = User $actor.alternateId$ had $failures$ MFA failures and $bypass_indicators$ bypass indicators. Event types: $event_types$. Source IPs: $source_ips$
action.notable.param.drilldown_name = View MFA activity
action.notable.param.drilldown_search = index=auth actor.alternateId="$actor.alternateId$" earliest=-4h | search eventType="*mfa*" OR eventType="*factor*"
