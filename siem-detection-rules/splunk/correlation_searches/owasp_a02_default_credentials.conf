[OWASP_A02_Default_Credentials_Usage]
search = index=* sourcetype=linux_secure OR sourcetype=WinEventLog:Security | where (user="admin" OR user="root" OR user="administrator" OR user="test" OR user="guest" OR user="default" OR user="user") AND (action="success" OR EventCode=4624) | eval is_service_account=if(match(user, "^(svc_|service_|app_)"), 1, 0) | where is_service_account=0 | stats count as login_count dc(src_ip) as source_ips values(src_ip) as ip_list values(dest) as targets by user _time span=30m | where login_count >= 1 | lookup known_service_accounts user OUTPUT is_known | where NOT is_known="true" | eval severity="high" | eval mitre_attack="T1078.001" | eval owasp_category="A02:2025-Security Misconfiguration"
cron_schedule = */10 * * * *
enableSched = 1
dispatch.earliest_time = -35m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 4h
alert.suppress.fields = user
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A02 - Default Credentials Login
action.notable = 1
action.notable.param.security_domain = access
action.notable.param.severity = high
action.notable.param.rule_title = Default Credentials Login Detected - $user$
action.notable.param.rule_description = User $user$ logged in successfully using default/common credentials from $source_ips$ source IPs to targets: $targets$.
action.notable.param.drilldown_name = View login activity
action.notable.param.drilldown_search = index=* (sourcetype=linux_secure OR sourcetype=WinEventLog:Security) user="$user$" earliest=-4h
