[OWASP_A04_Cleartext_Sensitive_Data_Transmission]
search = index=network sourcetype=bro:conn OR sourcetype=zeek:conn OR sourcetype=pan:traffic | where dest_port IN (80, 21, 23, 25, 110, 143, 389, 3306, 5432, 1433, 27017) | lookup sensitive_servers dest_ip OUTPUT is_sensitive server_role | where is_sensitive="true" | stats count as cleartext_connections dc(src_ip) as unique_sources dc(dest_ip) as unique_destinations values(dest_port) as ports values(server_role) as roles by app _time span=1h | where cleartext_connections >= 10 | eval severity=case(match(roles, "(?i)(database|pci|pii|financial)"), "critical", cleartext_connections>=50, "high", 1=1, "medium") | eval mitre_attack="T1040,T1557" | eval owasp_category="A04:2025-Cryptographic Failures"
cron_schedule = 0 * * * *
enableSched = 1
dispatch.earliest_time = -65m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 4h
alert.suppress.fields = app
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A04 - Cleartext Sensitive Data Transmission
action.notable = 1
action.notable.param.security_domain = network
action.notable.param.severity = high
action.notable.param.rule_title = Cleartext Data to Sensitive Server - $roles$
action.notable.param.rule_description = $cleartext_connections$ cleartext connections detected to sensitive servers (roles: $roles$) on ports $ports$ from $unique_sources$ unique sources.
action.notable.param.drilldown_name = View cleartext traffic
action.notable.param.drilldown_search = index=network dest_port IN (80, 21, 23, 25, 110, 143, 389, 3306, 5432, 1433, 27017) earliest=-4h | lookup sensitive_servers dest_ip OUTPUT is_sensitive | where is_sensitive="true"
