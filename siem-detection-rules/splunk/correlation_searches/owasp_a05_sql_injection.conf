[OWASP_A05_SQL_Injection_Detection]
search = index=web sourcetype=access_combined OR sourcetype=iis OR sourcetype=modsecurity | eval full_request=uri_path + "?" + uri_query | where match(full_request, "(?i)((\%27)|('))\s*((\%6F)|o|(\%4F))((\%72)|r|(\%52))") OR match(full_request, "(?i)(union\s+(all\s+)?select)") OR match(full_request, "(?i)(;\s*(drop|alter|create|insert|update|delete|exec|execute|xp_))") OR match(full_request, "(?i)(benchmark\s*\(|sleep\s*\(|waitfor\s+delay)") OR match(full_request, "(?i)(load_file|into\s+(out|dump)file)") OR match(full_request, "(?i)(information_schema|sys\.objects|sysobjects)") | eval injection_type=case(match(full_request, "(?i)union.*select"), "union_based", match(full_request, "(?i)(sleep|benchmark|waitfor)"), "time_based_blind", match(full_request, "(?i)(load_file|into.*file)"), "file_access", 1=1, "generic") | stats count as sqli_attempts dc(uri_path) as targeted_endpoints values(injection_type) as types values(uri_path) as endpoints by src_ip clientip _time span=5m | where sqli_attempts >= 3 | eval severity=case(match(types, "file_access"), "critical", sqli_attempts>=10, "critical", sqli_attempts>=5, "high", 1=1, "medium") | eval mitre_attack="T1190" | eval owasp_category="A05:2025-Injection"
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = src_ip
alert.digest_mode = 0
actions = notable
action.correlationsearch.enabled = 1
action.correlationsearch.label = OWASP A05 - SQL Injection Attack
action.notable = 1
action.notable.param.security_domain = network
action.notable.param.severity = critical
action.notable.param.rule_title = SQL Injection Attack - $src_ip$
action.notable.param.rule_description = Source $src_ip$ launched $sqli_attempts$ SQL injection attempts against $targeted_endpoints$ endpoints. Techniques: $types$. Targeted paths: $endpoints$
action.notable.param.drilldown_name = View SQLi attempts
action.notable.param.drilldown_search = index=web src_ip="$src_ip$" earliest=-1h | regex uri_query="(?i)(union|select|drop|sleep|benchmark|insert|update|delete)"
